name: VIP cutover
on:
  pull_request:
    paths: ['lab/cutover/**', '!lab/cutover/**/*.md', 'lab/ipvs/sessions.py', 'lab/filter/probe.py', '.github/workflows/cutover.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutover:
    strategy:
      fail-fast: false
      matrix:
        sync: [0, 1]
        loss: [0]
        fault: [0]
        vrrp: [0]
        ha: [0]
        include:
          - sync: 1
            loss: 1
          - sync: 0
            loss: 0
            fault: 1
          - sync: 1
            loss: 0
            fault: 1
          - sync: 0
            loss: 0
            fault: 0
            vrrp: 1
          - sync: 1
            loss: 0
            fault: 0
            vrrp: 1
          - sync: 1
            loss: 0
            fault: 0
            vrrp: 1
            ha: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends keepalived ipvsadm prometheus-node-exporter nftables
      - run: sudo env L4LOAD_CUTOVER=1 L4LOAD_SYNC=${{ matrix.sync }} L4LOAD_SYNC_LOSS=${{ matrix.loss }} L4LOAD_FORWARDING_FAILURE=${{ matrix.fault || 0 }} L4LOAD_VRRP=${{ matrix.vrrp || 0 }} L4LOAD_HA_PROFILE=${{ matrix.ha || 0 }} bash lab/ipvs/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('lab/results/ipvs').glob('*')):
              if p.suffix in ('.txt', '.json', '.jsonl', '.conf') or p.name in ('vrrp-1.log', 'vrrp-2.log', 'alt-checker.log'):
                  print('EVIDENCE ' + json.dumps({'file': p.name, 'content': p.read_text()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-cutover-${{ matrix.sync }}-${{ matrix.loss }}-${{ matrix.fault || 0 }}-${{ matrix.vrrp || 0 }}-${{ matrix.ha || 0 }}
          path: lab/results/ipvs
