name: IPVS lifecycle
on:
  push:
    paths: ['lab/ipvs/**', 'lab/katran/scenario.py', '.github/workflows/ipvs.yml']
  pull_request:
    paths: ['lab/ipvs/**', 'lab/katran/scenario.py', '.github/workflows/ipvs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y keepalived ipvsadm
      - run: sudo systemctl stop keepalived
      - run: sudo bash lab/ipvs/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipvs-lifecycle
          path: lab/results/ipvs
          if-no-files-found: warn
