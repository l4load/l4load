name: IPVS lifecycle
on:
  push:
    branches: [main]
    paths: ['profiles/ipvs/**', 'lab/ipvs/**', 'lab/katran/scenario.py', '.github/workflows/ipvs.yml']
  pull_request:
    paths: ['profiles/ipvs/**', 'lab/ipvs/**', 'lab/katran/scenario.py', '.github/workflows/ipvs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends keepalived ipvsadm prometheus-node-exporter
      - run: |
          sudo systemctl mask --now keepalived
          sudo systemctl stop prometheus-node-exporter
          mkdir -p lab/results/ipvs
          cd lab/results/ipvs
          apt-get download "keepalived=$(dpkg-query -W -f='${Version}' keepalived)"
          curl -fL https://archive.ubuntu.com/ubuntu/pool/main/k/keepalived/keepalived_2.3.2-1_amd64.deb -o upgrade.deb
          echo '3a989625aa4206c3c0bd4c6a5d8e16dcba1d55e4ba47d3554ce51e86051cc5e3  upgrade.deb' | sha256sum -c -
          apt-get -s install ./upgrade.deb > upgrade-plan.txt
          test "$(awk '/^Inst / {print $2}' upgrade-plan.txt)" = keepalived
          ! grep -q '^Remv ' upgrade-plan.txt
        id: setup
      - run: sudo bash lab/ipvs/run.sh
      - run: sudo env L4LOAD_MH=1 L4LOAD_TRIAL=mh bash lab/ipvs/run.sh
      - run: sudo bash lab/ipvs/ipv6.sh
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      - name: Preserve diagnostic evidence in the job log
        if: always()
        run: |
          python3 - <<'PYLOG'
          import json
          from pathlib import Path
          for path in sorted(Path('lab/results').glob('ipvs*/*')):
              if path.suffix in ('.txt', '.conf', '.json', '.jsonl') or path.name == 'validation.log':
                  print('EVIDENCE ' + json.dumps({'file': str(path.relative_to('lab/results')), 'content': path.read_text()}))
          PYLOG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipvs-lifecycle
          path: lab/results/ipvs*
          if-no-files-found: warn
