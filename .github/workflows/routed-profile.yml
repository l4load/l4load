name: Routed profile install
on:
  pull_request:
    paths: ['profiles/ipvs/install-routed.py', 'profiles/ipvs/routed-run.py', 'profiles/ipvs/route-gate.py', 'profiles/ipvs/l4load-routed@.service', 'profiles/ipvs/l4load-ipvs@.service', '.github/workflows/routed-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm keepalived
      - run: |
          sudo systemctl stop bird.service || true
          printf '%s\n' '{"vip":"198.18.0.1","local_ip":"10.1.1.2","local_as":65001,"peer_ip":"10.1.1.1","peer_as":65000,"sync_interface":"sync0","sync_id":42}' > /tmp/routed.json
          sudo python3 profiles/ipvs/install-routed.py d1 /tmp/routed.json /bin/true profiles/ipvs/keepalived.conf
          sudo systemd-analyze verify /etc/systemd/system/l4load-routed@.service
          sudo systemd-analyze verify /etc/systemd/system/l4load-ipvs@.service
          sudo bird -p -c /etc/l4load/bird-d1.conf
          sudo test "$(systemctl is-enabled bird.service)" = masked
          sudo test "$(systemctl is-enabled keepalived.service)" = masked
          sudo test -f /etc/l4load/ipvs-d1.conf
          sudo test -x /etc/l4load/check-d1
          sudo grep -q 'disabled;' /etc/l4load/bird-d1.conf
      - run: |
          sudo bash <<'SH'
          set -euo pipefail
          mkdir -p /run/l4load-routed-d1
          bird -f -c /etc/l4load/bird-d1.conf -s /run/l4load-routed-d1/bird.ctl > /tmp/l4load-bird.log 2>&1 &
          bird_pid=$!
          trap 'kill "$bird_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do test -S /run/l4load-routed-d1/bird.ctl && break; sleep 0.1; done
          birdc -s /run/l4load-routed-d1/bird.ctl 'show route all' > /tmp/route-before.txt
          ! grep -q '198.18.0.1/32' /tmp/route-before.txt
          python3 /usr/local/libexec/l4load-route-gate.py /run/l4load-routed-d1/bird.ctl vip - -- /bin/true > /tmp/route-gate.log 2>&1 &
          gate_pid=$!
          for attempt in $(seq 1 100); do grep -q '"action": "enable"' /tmp/route-gate.log && break; sleep 0.1; done
          grep -q '"action": "enable"' /tmp/route-gate.log
          birdc -s /run/l4load-routed-d1/bird.ctl 'show route all' | grep -q '198.18.0.1/32'
          kill "$gate_pid"
          wait "$gate_pid"
          birdc -s /run/l4load-routed-d1/bird.ctl 'show route all' > /tmp/route-after.txt
          ! grep -q '198.18.0.1/32' /tmp/route-after.txt
          SH
