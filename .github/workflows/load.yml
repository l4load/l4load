name: Load harness
on:
  push:
    paths: ['lab/load/**', 'lab/ipvs/run.sh', '.github/workflows/load.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipvs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends keepalived ipvsadm prometheus-node-exporter sockperf
      - run: sudo systemctl stop keepalived prometheus-node-exporter
      - run: sudo env L4LOAD_LOAD=1 bash lab/ipvs/run.sh
      - name: Record measurements
        if: always()
        run: |
          python3 - <<'PYLOG'
          import hashlib, json
          from pathlib import Path
          for path in sorted(Path('lab/results/ipvs/load').glob('*')):
              if path.suffix == '.txt':
                  print('EVIDENCE ' + json.dumps({'file': path.name, 'content': path.read_text()}))
              elif path.suffix == '.csv':
                  print('SAMPLES ' + json.dumps({'file': path.name, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}))
          PYLOG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-harness
          path: lab/results/ipvs
