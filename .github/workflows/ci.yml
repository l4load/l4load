name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: find lab -name '*.sh' -exec bash -n {} \;
      - run: python3 -m compileall -q lab scripts
      - run: python3 scripts/build_site.py
