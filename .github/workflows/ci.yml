name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -v ./...
      - run: go run ./cmd/l4load -config examples/local.json -check
      - run: go build -o bin/l4load ./cmd/l4load
      - run: python3 scripts/build_site.py
