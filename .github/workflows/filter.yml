name: Filter lifecycle
on:
  pull_request:
    paths: ['lab/filter/**', 'profiles/nftables/**', '!profiles/nftables/**/*.md', '.github/workflows/filter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends keepalived ipvsadm prometheus-node-exporter nftables
      - run: sudo env L4LOAD_FILTER=1 L4LOAD_FILTER_SNAPSHOTS=1 bash lab/ipvs/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('lab/results/ipvs').glob('*')):
              if p.suffix in ('.txt', '.json', '.nft'):
                  print('EVIDENCE ' + json.dumps({'file': p.name, 'content': p.read_text()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-lifecycle
          path: lab/results/ipvs
