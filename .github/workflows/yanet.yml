name: YANET baseline
on:
  push:
    paths: ['lab/yanet/**', '!lab/yanet/**/*.md', 'lab/filter/**', '!lab/filter/**/*.md', 'lab/ipvs/run.sh', 'lab/katran/run.sh', 'lab/katran/scenario.py', 'lab/load/**', '!lab/load/**/*.md', '.github/workflows/yanet.yml']
  workflow_dispatch:
    inputs:
      workload_placement:
        description: Repeat the three-engine CPU-placement experiment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      options: --privileged --volume /lib/modules:/lib/modules:ro
      image: yanetplatform/builder-lite@sha256:e37933067f57fc5025df09cd329bf494d97d5d866be31acfb022e9721a6758c8
    env:
      CCACHE_DIR: /tmp/l4load-ccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yanet-platform/yanet
          ref: dacf4015f794e978c74200bb49f35472114d66aa
          submodules: recursive
          path: upstream/yanet
      - uses: actions/checkout@v4
        with:
          repository: facebookincubator/katran
          ref: 4546144594d11d7bf342d008e7b94922fc9bbaa3
          path: upstream/katran
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/l4load-ccache
          key: yanet-6b30c2f-builder-e379330-v1-${{ github.sha }}
          restore-keys: yanet-6b30c2f-builder-e379330-v1-
      - run: apt-get update && apt-get install -y cmake ccache iproute2 kmod tcpdump ethtool sockperf keepalived ipvsadm prometheus-node-exporter clang llvm libbpf-dev linux-tools-common linux-tools-generic
      - run: ccache --max-size=2G
      - name: Record environment
        run: |
          mkdir -p lab/results/yanet
          date -u +%FT%TZ > lab/results/yanet/started.txt
          uname -a > lab/results/yanet/kernel.txt
          lscpu > lab/results/yanet/cpu.txt
          free -m > lab/results/yanet/memory.txt
          git -C upstream/yanet rev-parse HEAD > lab/results/yanet/upstream.txt
          git -C upstream/yanet submodule status --recursive > lab/results/yanet/submodules.txt
          dpkg-query -W > lab/results/yanet/packages.txt
      - run: python3 lab/yanet/test_tap.py
      - name: Build upstream autotest
        id: build
        run: |
          cd upstream/yanet
          python3 - <<'PYMTU'
          from pathlib import Path
          path = Path('common/config.release.h')
          config = path.read_text()
          old = '#define CONFIG_YADECAP_MTU (9000)'
          assert config.count(old) == 1
          path.write_text(config.replace(old, '#define CONFIG_YADECAP_MTU (1500)'))
          PYMTU
          git diff -- common/config.release.h > ../../lab/results/yanet/build-profile.txt
          CC="ccache gcc" CXX="ccache g++" meson setup --prefix=/target -Dtarget=autotest -Dstrip=true -Db_lto=false build_autotest 2>&1 | tee ../../lab/results/yanet/configure.log
          meson compile -C build_autotest -j 2 2>&1 | tee ../../lab/results/yanet/build.log
      - name: Check live DSR forwarding
        timeout-minutes: 5
        run: unshare --ipc bash lab/yanet/run.sh upstream/yanet
      - name: Check native firewall lifecycle
        timeout-minutes: 5
        run: L4LOAD_FILTER=1 L4LOAD_TRIAL=filter unshare --ipc bash lab/yanet/run.sh upstream/yanet af-packet
      - name: Compare workload placement
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.workload_placement }}
        timeout-minutes: 25
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream/katran"
          for engine in ipvs katran yanet; do
            for trial in baseline-before cpu-3 baseline-after; do
              export L4LOAD_TRIAL="$trial" L4LOAD_LOAD=1
              unset L4LOAD_CPUS
              if [ "$trial" = cpu-3 ]; then export L4LOAD_CPUS=3; fi
              printf '%s %s %s\n' "$(date -u +%FT%TZ)" "$L4LOAD_TRIAL" "$engine" >> lab/results/order.txt
              case "$engine" in
                ipvs) bash lab/ipvs/run.sh ;;
                katran) bash lab/katran/run.sh upstream/katran ;;
                yanet) unshare --ipc bash lab/yanet/run.sh upstream/yanet af-packet ;;
              esac
            done
          done
      - name: Exercise public balancer cases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          cd upstream/yanet
          python3 - <<'PYCONFIG'
          import json
          from pathlib import Path
          config = json.loads(Path('autotest/units/001_one_port/dataplane.conf').read_text())
          config['ealArgs'] = config.get('ealArgs', []) + ['--no-pci']
          Path('../../lab/results/yanet/dataplane.conf').write_text(json.dumps(config, indent=2))
          PYCONFIG
          timeout --kill-after=10s 180s unshare --ipc python3 -u autotest/yanet-autotest-run.py --prefix="$PWD/build_autotest" \
            ../../lab/results/yanet \
            autotest/units/001_one_port/049_balancer_tcp_udp \
            autotest/units/001_one_port/049_balancer_real_ipv4 \
            autotest/units/001_one_port/049_balancer_reload \
            autotest/units/001_one_port/056_balancer_ops \
            2>&1 | tee ../../lab/results/yanet/autotest.log
      - name: Repeat reload qualification
        timeout-minutes: 5
        run: |
          cd upstream/yanet
          for attempt in 1 2 3 4 5; do
            timeout --kill-after=10s 45s unshare --ipc \
              python3 -u autotest/yanet-autotest-run.py --prefix="$PWD/build_autotest" \
              ../../lab/results/yanet autotest/units/001_one_port/049_balancer_reload \
              2>&1 | tee "../../lab/results/yanet/reload-$attempt.log"
            echo "RELOAD_REPEAT_PASS $attempt"
          done
      - name: Collect runtime diagnostics
        if: always()
        run: |
          ps -eo pid,ppid,pgid,stat,wchan:32,args > lab/results/yanet/processes.txt
          for file in /tmp/yanet*.pcap /tmp/yanet-dp.report; do
            if [ -f "$file" ]; then cp "$file" lab/results/yanet/; fi
          done
          for file in lab/results/yanet/autotest.log lab/results/yanet-dsr*/*.log; do
            if [ -f "$file" ]; then
              echo "$file"
              tail -n 100 "$file"
            fi
          done
      - name: Preserve configuration evidence
        if: always()
        run: |
          python3 - <<'PYLOG'
          import json
          from pathlib import Path
          for path in sorted(Path('lab/results').glob('**/*')):
              if path.suffix in ('.txt', '.conf', '.json'):
                  print('EVIDENCE ' + json.dumps({'file': str(path.relative_to('lab/results')), 'content': path.read_text()}))
          PYLOG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yanet-baseline
          path: |
            lab/results
            upstream/yanet/build_autotest/meson-logs
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/l4load-ccache
          key: yanet-6b30c2f-builder-e379330-v1-${{ github.sha }}
