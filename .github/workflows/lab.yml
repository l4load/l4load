name: virtual lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static cpio
      - run: bash lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtual-lab
          path: |
            lab/results/manifest.json
            lab/results/serial.log
          if-no-files-found: warn
