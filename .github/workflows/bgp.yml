name: BGP route trial
on:
  pull_request:
    paths: ['lab/bgp/**', 'profiles/ipvs/install-routed.py', 'profiles/ipvs/routed-run.py', 'profiles/ipvs/l4load-routed@.service', 'profiles/ipvs/l4load-ipvs@.service', 'profiles/ipvs/route-gate.py', 'profiles/ipvs/update.sh', '.github/workflows/bgp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        traffic: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm nftables keepalived
      - run: sudo env L4LOAD_BGP_TRAFFIC=${{ matrix.traffic }} bash lab/bgp/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          for p in sorted(Path('lab/results/bgp').glob('*')):
              if p.suffix in ('.txt', '.log', '.conf', '.json', '.jsonl'):
                  print('EVIDENCE ' + json.dumps({'file': p.name, 'content': p.read_text()}))
              elif p.name in ('useful-tcp.csv', 'useful-udp.csv'):
                  raw=p.read_bytes()
                  print('EVIDENCE_CSV ' + json.dumps({'file': p.name, 'sha256': hashlib.sha256(raw).hexdigest(), 'gzip_base64': base64.b64encode(gzip.compress(raw, mtime=0)).decode()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-route-${{ matrix.traffic }}
          path: lab/results/bgp
  attack:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm nftables keepalived sockperf
      - run: sudo env L4LOAD_BGP_TRAFFIC=8 L4LOAD_BGP_LOAD=1 bash lab/bgp/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('denied-load.json', 'useful-tcp.json', 'useful-udp.json', 'failover-summary.json', 'phase-summary.json', 'phase-snapshots.jsonl', 'denied-probe.jsonl', 'allowed-probe.jsonl', 'filter-d1.txt', 'filter-d2.txt'):
              path=Path('lab/results/bgp')/name
              if path.exists(): print('EVIDENCE '+json.dumps({'file':name,'content':path.read_text()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-attack
          path: lab/results/bgp
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm nftables keepalived sockperf
      - run: sudo env L4LOAD_BGP_TRAFFIC=8 L4LOAD_BGP_LOAD=1 L4LOAD_BGP_SOAK=1 bash lab/bgp/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('denied-load.json', 'soak-summary.json', 'phase-summary.json', 'failover-summary.json', 'useful-tcp.json', 'useful-udp.json'):
              path=Path('lab/results/bgp')/name
              if path.exists(): print('EVIDENCE '+json.dumps({'file':name,'content':path.read_text()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-soak
          path: lab/results/bgp
  high-rate-failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm nftables keepalived sockperf
      - run: sudo env L4LOAD_BGP_TRAFFIC=8 L4LOAD_BGP_LOAD=1 L4LOAD_BGP_HIGH_RATE=1 bash lab/bgp/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('denied-load.json', 'useful-tcp.json', 'useful-udp.json', 'failover-summary.json', 'phase-summary.json'):
              path=Path('lab/results/bgp')/name
              if path.exists(): print('EVIDENCE '+json.dumps({'file':name,'content':path.read_text()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-high-rate-failover
          path: lab/results/bgp
  false-miss:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm nftables keepalived
      - run: sudo env L4LOAD_BGP_TRAFFIC=8 L4LOAD_BGP_FALSE_MISS=1 bash lab/bgp/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-false-miss
          path: lab/results/bgp
  endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bird2 ipvsadm nftables keepalived sockperf
      - run: sudo env L4LOAD_BGP_TRAFFIC=8 L4LOAD_BGP_LOAD=1 L4LOAD_BGP_SOAK=1 L4LOAD_BGP_SOAK_SECONDS=300 bash lab/bgp/run.sh
      - if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('denied-load.json', 'soak-summary.json', 'phase-summary.json', 'failover-summary.json'):
              path=Path('lab/results/bgp')/name
              if path.exists(): print('EVIDENCE '+json.dumps({'file':name,'content':path.read_text()}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-endurance
          path: lab/results/bgp
